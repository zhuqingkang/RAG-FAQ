# LLM 配置
# 全部走 OpenAI 兼容协议：换供应商只改 model / base_url / api_key 三项，代码不用动
# 旧的 dashscope_api_key / dashscope_base_url 仍兼容（新键缺失时自动回退）
[llm]
# 模型名：必须与供应商侧的模型标识一致
model = qwen3.7-plus

# API 密钥：本地 vLLM / Ollama 没有鉴权时也要填非空值（例如 EMPTY），否则 SDK 报错
api_key = sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# OpenAI 兼容地址
base_url = https://ws-r946z7jbbcv58jsh.cn-beijing.maas.aliyuncs.com/compatible-mode/v1

# 单次生成超时（秒）：云端 60 ~ 120；本地小模型给 30 就够
timeout = 60

# 联网搜索：enable_search 是 DashScope 专有参数，其它供应商带上会直接 400
# auto = 仅当 base_url 指向 DashScope 时启用；on / off 为强制开关
web_search = auto

# ---------------- 常见供应商对照（按本地实测延迟挑一个） ----------------
#
# ① 阿里云 DashScope（通义千问）—— 国内直连，延迟最低的一档
#    base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
#    model    = qwen-plus / qwen3.7-plus
#    api_key  = 控制台 sk-...
#
# ② DeepSeek 官方 —— 性价比高，deepseek-chat 通常 1~3 s 首 token
#    base_url = https://api.deepseek.com/v1
#    model    = deepseek-chat（通用）/ deepseek-reasoner（推理更强、更慢）
#    api_key  = platform.deepseek.com 申请
#
# ③ 本地 vLLM —— 零请求费用、数据不出内网，延迟取决于显卡
#    python -m vllm.entrypoints.openai.api_server \
#        --model Qwen/Qwen2.5-7B-Instruct --port 8000
#    base_url = http://127.0.0.1:8000/v1
#    model    = Qwen/Qwen2.5-7B-Instruct      # 与 --model 完全一致
#    api_key  = EMPTY                          # 本地无鉴权，但 SDK 要求非空
#    timeout  = 90                             # 冷启动/长回答留足时间
#    参考：RTX 4060 8G 跑 7B（AWQ 量化）约 30~50 tok/s，首 token 0.3~0.8 s
#
# ④ Ollama / LM Studio / OneAPI 等本地网关 —— 同样是 OpenAI 兼容
#    base_url = http://127.0.0.1:11434/v1      # Ollama
#    model    = qwen2.5:7b
#    api_key  = EMPTY
#
# 选型建议：先用 loadtest/bench_qa.py 压一轮，比较 P95 而不是平均值 ——
# 云端供应商的尾延迟受网络抖动影响大，本地 vLLM 更稳定但吞吐受显存限制。

# 缓存配置
# 把目录清单 / 解析文本 / 父子切块结果落成 JSON，下次直接读，减少磁盘 IO
[cache]
# 缓存目录（相对路径按当前工作目录解析，建议保持默认）
# cache_dir = rag_qa/data/.cache
# 是否逐个文件核对 mtime/size：False=完全信任目录清单，最省 IO
# 文件内容被原地覆盖（目录 mtime 不变）时改成 True
verify_files = False
# 是否启用父子切块结果缓存
chunks = True

# 检索参数配置
# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2

# 会话保留策略
# 按 chat_sessions.updated_at 判定，以会话为单位整体清理
[chat]
# 未登录（临时）会话保留天数
anonymous_retention_days = 1
# 已登录用户的会话保留天数
user_retention_days = 30
# 服务启动时是否自动清理一次
auto_purge = true

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 12345678